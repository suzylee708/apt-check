name: Check 550 Clinton Avenue Unit

on:
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼도 사용 가능
  # 참고: GitHub 내부 schedule 트리거는 활동량 적은 저장소에서
  # 실행 빈도가 들쭉날쭉해서 제거했습니다. 대신 외부 cron 서비스가
  # GitHub API(workflow_dispatch)를 호출해 이 워크플로우를 실행합니다.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KEYWORDS: "550 Clinton, Eight80, 1010 Pacific, Atlantic BK, 1057 Atlantic, The Grand Pacific, 985 Pacific"
        run: python check_units.py
